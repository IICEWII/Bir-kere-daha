<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SON KURŞUN</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#120b08;
    font-family:Georgia,serif;
    color:#f5dfad;
}

button{
    font-family:Georgia,serif;
}

.game{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
        linear-gradient(
            rgba(20,8,4,.12),
            rgba(20,8,4,.70)
        ),
        url("0510AF5B-D9F9-407E-8F54-6A32B9EDFF43.png")
        center center / cover no-repeat;
}

/* KARARTMA */

.game::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:40;

    background:
        radial-gradient(
            circle at center,
            transparent 28%,
            rgba(0,0,0,.72) 100%
        );
}

/* ÜST BAR */

.topbar{
    position:absolute;
    z-index:60;

    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:9px 13px;

    background:
        linear-gradient(
            #382116,
            #1b0e09
        );

    border:1px solid #9b7040;
    border-radius:9px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.6),
        inset 0 1px rgba(255,220,150,.2);
}

.logo{
    font-size:17px;
    font-weight:bold;
    letter-spacing:2px;
    color:#e8c178;
    text-shadow:2px 2px #000;
}

.stats{
    display:flex;
    gap:11px;
    font-size:13px;
}

.stat{
    display:flex;
    gap:3px;
    align-items:center;
}

/* RAKİP */

.enemy{
    position:absolute;
    z-index:45;

    top:16%;
    left:50%;

    transform:translateX(-50%);

    width:90%;
    text-align:center;
}

.enemy-name{
    font-size:30px;
    font-weight:bold;
    letter-spacing:3px;

    text-shadow:
        3px 3px #1a0905,
        0 0 15px #000;
}

.enemy-title{
    margin-top:4px;
    font-size:14px;
    color:#d9bb83;
}

.health{
    width:190px;
    height:8px;

    margin:11px auto;

    background:#1b0d08;

    border:1px solid #6e4126;
    border-radius:8px;

    overflow:hidden;
}

.health-fill{
    height:100%;
    width:100%;
    background:#a9281e;

    transition:.3s;
}

/* DURUM */

.status{
    position:absolute;
    z-index:55;

    top:37%;
    left:50%;

    transform:translateX(-50%);

    width:100%;
    text-align:center;
}

.message{
    font-size:34px;
    font-weight:bold;
    letter-spacing:3px;

    text-shadow:
        3px 3px #1a0905,
        0 0 20px #000;
}

.submessage{
    margin-top:7px;
    font-size:14px;
    color:#e5cc9b;
}

/* OYUNCU */

.player{
    position:absolute;
    z-index:45;

    bottom:4%;
    left:50%;

    transform:translateX(-50%);

    width:100%;
    text-align:center;
}

.player-label{
    font-size:13px;
    letter-spacing:3px;
    color:#c9a66d;

    text-shadow:2px 2px #000;
}

/* KILIFTAKİ SİLAH */

.gun-holster{
    position:relative;

    width:170px;
    height:92px;

    margin:0 auto 3px;
}

.gun{
    position:absolute;

    width:104px;
    height:22px;

    right:5px;
    bottom:22px;

    background:
        linear-gradient(
            #57534b,
            #171513
        );

    border:3px solid #0b0908;
    border-radius:4px;

    transform:rotate(-12deg);

    box-shadow:
        0 6px 12px rgba(0,0,0,.7);
}

.gun::after{
    content:"";

    position:absolute;

    width:24px;
    height:39px;

    right:58px;
    top:17px;

    background:
        linear-gradient(
            90deg,
            #75482a,
            #2b170d
        );

    border:2px solid #140b07;

    transform:rotate(28deg);
}

/* ANİMASYONLU SİLAH */

.draw-gun{

    position:absolute;

    z-index:52;

    width:92px;
    height:19px;

    left:50%;
    top:43%;

    opacity:0;

    transform:
        translate(-5px,28px)
        rotate(-70deg);

    transform-origin:78% 50%;

    background:
        linear-gradient(
            #68635a,
            #161514
        );

    border:3px solid #080706;
    border-radius:4px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.7);

    pointer-events:none;
}

.draw-gun::after{

    content:"";

    position:absolute;

    width:22px;
    height:36px;

    right:50px;
    top:15px;

    background:
        linear-gradient(
            90deg,
            #75482a,
            #2a160c
        );

    border:2px solid #120a06;

    transform:rotate(28deg);
}

/* RAKİP SİLAHI */

.enemy-gun{
    top:42%;
    margin-left:28px;
}

/* OYUNCU SİLAHI */

.player-gun{
    top:auto;
    bottom:15%;
    left:50%;
    margin-left:-2px;
}

/* RAKİP ÇEKİYOR */

.enemy-gun.drawing{

    opacity:1;

    animation:
        enemyDraw
        .24s
        cubic-bezier(.2,.9,.3,1)
        forwards;
}

@keyframes enemyDraw{

    0%{
        transform:
            translate(-8px,28px)
            rotate(-70deg);
    }

    65%{
        transform:
            translate(8px,0)
            rotate(-25deg);
    }

    100%{
        transform:
            translate(12px,-2px)
            rotate(-12deg);
    }
}

/* OYUNCU ÇEKİYOR */

.player-gun.drawing{

    opacity:1;

    animation:
        playerDraw
        .20s
        cubic-bezier(.2,.9,.3,1)
        forwards;
}

@keyframes playerDraw{

    0%{
        transform:
            translate(-8px,35px)
            rotate(-72deg);
    }

    65%{
        transform:
            translate(4px,5px)
            rotate(-25deg);
    }

    100%{
        transform:
            translate(10px,0)
            rotate(-12deg);
    }
}

/* GERİ TEPME */

.draw-gun.fired{
    opacity:1;
    animation:
        recoil
        .15s
        ease-out
        forwards;
}

@keyframes recoil{

    0%{
        transform:
            translate(10px,0)
            rotate(-12deg);
    }

    45%{
        transform:
            translate(-6px,2px)
            rotate(-18deg);
    }

    100%{
        transform:
            translate(10px,0)
            rotate(-12deg);
    }
}

/* NAMLU ALEVİ */

.muzzle{

    position:absolute;

    z-index:70;

    width:52px;
    height:52px;

    border-radius:50%;

    opacity:0;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            #fff 0 8%,
            #ffd45b 16%,
            #ff7a19 35%,
            #c51e08 55%,
            transparent 70%
        );

    filter:
        drop-shadow(
            0 0 14px #ffb52e
        );
}

.enemy-muzzle{
    left:calc(50% + 92px);
    top:40.5%;
}

.player-muzzle{
    left:calc(50% + 70px);
    bottom:17.2%;
}

.muzzle.flash{

    animation:
        flash
        .13s
        ease-out
        forwards;
}

@keyframes flash{

    0%{
        opacity:0;
        transform:scale(.25);
    }

    25%{
        opacity:1;
        transform:scale(1.25);
    }

    100%{
        opacity:0;
        transform:scale(.35);
    }
}

/* ÇEK BUTONU */

.fire-area{

    position:absolute;

    z-index:80;

    bottom:12%;
    left:50%;

    transform:translateX(-50%);

    text-align:center;
}

.fire-button{

    width:140px;
    height:140px;

    border-radius:50%;

    border:7px solid #21110b;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f0d28c,
            #ad702e 52%,
            #482012
        );

    color:#28130b;

    font-size:26px;
    font-weight:bold;

    box-shadow:
        0 8px 0 #160b07,
        0 15px 35px rgba(0,0,0,.65),
        inset 0 2px rgba(255,240,180,.5);

    transition:.08s;
}

.fire-button:active{

    transform:translateY(7px);

    box-shadow:
        0 2px 0 #160b07;
}

.fire-button.ready{

    animation:
        readyPulse
        .35s
        infinite alternate;
}

@keyframes readyPulse{

    from{

        transform:scale(1);

        box-shadow:
            0 8px 0 #160b07,
            0 0 15px #d9a642;
    }

    to{

        transform:scale(1.07);

        box-shadow:
            0 8px 0 #160b07,
            0 0 45px #ffcf64;
    }
}

/* RAKİP VURULMA */

.enemy.hit{

    animation:
        enemyHit
        .22s
        ease-in-out;
}

@keyframes enemyHit{

    25%{
        transform:
            translateX(-50%)
            translateX(-9px);
    }

    75%{
        transform:
            translateX(-50%)
            translateX(7px);
    }
}

/* EKRANLAR */

.overlay{

    position:absolute;

    z-index:100;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        rgba(13,7,4,.78);

    backdrop-filter:blur(4px);
}

.panel{

    width:100%;
    max-width:420px;

    padding:30px 23px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #3c2417,
            #1b100b
        );

    border:2px solid #9c713e;

    border-radius:12px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.8);
}

.panel h1{

    margin:0;

    font-size:42px;

    letter-spacing:3px;

    color:#e8c178;

    text-shadow:
        3px 3px #160906;
}

.panel p{

    color:#d8c29a;

    line-height:1.55;
}

.start-button{

    margin-top:14px;

    padding:16px 28px;

    border:2px solid #b9894c;

    border-radius:7px;

    background:#9c602a;

    color:#fff0c9;

    font-weight:bold;

    font-size:17px;

    box-shadow:
        0 5px 0 #3b1b0e;
}

.start-button:active{

    transform:translateY(5px);

    box-shadow:none;
}

.hidden{
    display:none !important;
}

/* MOBİL */

@media(max-height:700px){

    .enemy{
        top:13%;
    }

    .status{
        top:33%;
    }

    .fire-area{
        bottom:8%;
    }

    .fire-button{
        width:115px;
        height:115px;
        font-size:21px;
    }

    .enemy-name{
        font-size:25px;
    }

    .player{
        bottom:1%;
    }

    .player-gun{
        bottom:12%;
    }
}

</style>
</head>

<body>

<div class="game">

<!-- ÜST BAR -->

<div class="topbar">

    <div class="logo">
        SON KURŞUN
    </div>

    <div class="stats">

        <div class="stat">
            ⭐ <span id="fame">0</span>
        </div>

        <div class="stat">
            💰 <span id="money">0</span>
        </div>

        <div class="stat">
            🔥 <span id="streak">0</span>
        </div>

    </div>

</div>


<!-- RAKİP -->

<div class="enemy" id="enemy">

    <div class="enemy-name" id="enemyName">
        BILLY KANE
    </div>

    <div class="enemy-title" id="enemyTitle">
        Kasabanın en hızlısı
    </div>

    <div class="health">

        <div
            class="health-fill"
            id="health">
        </div>

    </div>

</div>


<!-- DURUM -->

<div class="status">

    <div
        class="message"
        id="message">

        HAZIR OL...

    </div>

    <div
        class="submessage"
        id="submessage">

        Rakibini izle.

    </div>

</div>


<!-- RAKİP ANİMASYONLU SİLAH -->

<div
    class="draw-gun enemy-gun"
    id="enemyGun">
</div>

<div
    class="muzzle enemy-muzzle"
    id="enemyMuzzle">
</div>


<!-- OYUNCU -->

<div class="player">

    <div class="gun-holster">

        <div class="gun"></div>

    </div>

    <div class="player-label">
        SEN
    </div>

</div>


<!-- OYUNCU ANİMASYONLU SİLAH -->

<div
    class="draw-gun player-gun"
    id="playerGun">
</div>

<div
    class="muzzle player-muzzle"
    id="playerMuzzle">
</div>


<!-- ÇEK -->

<div class="fire-area">

    <button
        class="fire-button"
        id="fireButton">

        ÇEK!

    </button>

</div>


<!-- BAŞLANGIÇ -->

<div
    class="overlay"
    id="startScreen">

    <div class="panel">

        <h1>🤠</h1>

        <h1>
            SON KURŞUN
        </h1>

        <p>
            Kasabanın en hızlı silahşoru
            olduğunu kanıtla.
        </p>

        <p>
            Rakibinin hareketlerini izle.
            <br>
            <b>ATEŞ!</b> anını bekle.
        </p>

        <button
            class="start-button"
            id="startButton">

            DÜELLOYA BAŞLA

        </button>

    </div>

</div>


<!-- SONUÇ -->

<div
    class="overlay hidden"
    id="resultScreen">

    <div class="panel">

        <h1 id="resultTitle">
            💀
        </h1>

        <p id="resultText"></p>

        <button
            class="start-button"
            id="againButton">

            TEKRAR DÜELLO

        </button>

    </div>

</div>

</div>


<script>

let playing = false;
let canShoot = false;

let timer = null;
let enemyTimer = null;

let money = 0;
let fame = 0;
let streak = 0;

let currentEnemy = 0;


/* RAKİPLER */

const enemies = [

    {
        name:"BILLY KANE",
        title:"Kasabanın en hızlısı",
        reaction:720,
        reward:20
    },

    {
        name:"JACK DALTON",
        title:"Sinsi kumarbaz",
        reaction:610,
        reward:30
    },

    {
        name:"MAD DOG",
        title:"Ne zaman ateş edeceği belli değil",
        reaction:520,
        reward:45
    },

    {
        name:"BLACK JACK",
        title:"Üç kasabanın aranan adamı",
        reaction:440,
        reward:65
    },

    {
        name:"EL DIABLO",
        title:"Efsane silahşor",
        reaction:370,
        reward:100
    }

];


const $ = id =>
    document.getElementById(id);


/* SES */

function sound(
    frequency,
    duration=.07,
    type="square",
    volume=.035
){

    try{

        const audio =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.type = type;

        oscillator.frequency.value =
            frequency;

        gain.gain.value =
            volume;

        oscillator.connect(gain);

        gain.connect(audio.destination);

        oscillator.start();

        oscillator.stop(
            audio.currentTime + duration
        );

    }catch(e){}

}


/* YAZI */

function setText(
    message,
    sub=""
){

    $("message").textContent =
        message;

    $("submessage").textContent =
        sub;
}


/* SİLAHLARI SIFIRLA */

function resetGuns(){

    [
        "enemyGun",
        "playerGun",
        "enemyMuzzle",
        "playerMuzzle"
    ].forEach(id => {

        $(id).classList.remove(
            "drawing",
            "fired",
            "flash"
        );

    });

}


/* ALEV */

function muzzleFlash(id){

    const element =
        $(id);

    element.classList.remove(
        "flash"
    );

    void element.offsetWidth;

    element.classList.add(
        "flash"
    );

}


/* OYUNCU SİLAH ÇEKİYOR */

function drawPlayer(){

    const gun =
        $("playerGun");

    gun.classList.remove(
        "drawing",
        "fired"
    );

    void gun.offsetWidth;

    gun.classList.add(
        "drawing"
    );

    setTimeout(()=>{

        gun.classList.add(
            "fired"
        );

        muzzleFlash(
            "playerMuzzle"
        );

        sound(
            105,
            .11,
            "sawtooth",
            .06
        );

    },150);

}


/* RAKİP SİLAH ÇEKİYOR */

function drawEnemy(){

    const gun =
        $("enemyGun");

    gun.classList.remove(
        "drawing",
        "fired"
    );

    void gun.offsetWidth;

    gun.classList.add(
        "drawing"
    );

    setTimeout(()=>{

        gun.classList.add(
            "fired"
        );

        muzzleFlash(
            "enemyMuzzle"
        );

        sound(
            90,
            .12,
            "sawtooth",
            .06
        );

    },150);

}


/* HUD */

function updateHud(){

    $("money").textContent =
        money;

    $("fame").textContent =
        fame;

    $("streak").textContent =
        streak;

}


/* TUR */

function prepareRound(){

    clearTimeout(timer);

    clearTimeout(enemyTimer);

    playing = true;

    canShoot = false;

    resetGuns();

    const enemy =
        enemies[
            Math.min(
                currentEnemy,
                enemies.length - 1
            )
        ];

    $("enemyName").textContent =
        enemy.name;

    $("enemyTitle").textContent =
        enemy.title;

    $("health").style.width =
        "100%";

    $("fireButton").classList.remove(
        "ready"
    );

    setText(
        "HAZIR OL...",
        "Rakibinin eline dikkat et."
    );


    /* RASTGELE BEKLEME */

    const wait =
        900 +
        Math.random() * 1700;


    timer = setTimeout(()=>{

        if(!playing)
            return;


        $("fireButton").classList.add(
            "ready"
        );

        canShoot = true;


        setText(
            "ATEŞ!",
            "ŞİMDİ ÇEK!"
        );


        sound(
            740,
            .12,
            "square",
            .045
        );


        /* RAKİP TEPKİ */

        const reaction =
            Math.max(
                250,
                enemy.reaction +
                (
                    Math.random()*100-50
                )
            );


        enemyTimer =
            setTimeout(()=>{

                if(!playing)
                    return;


                drawEnemy();

                canShoot = false;


                setText(
                    "ÇOK GEÇ!",
                    "Rakibin senden hızlıydı."
                );


                endRound(
                    false,
                    "Rakibin senden önce çekti."
                );


            },reaction);


    },wait);

}


/* BAŞLAT */

function startGame(){

    $("startScreen")
        .classList
        .add("hidden");

    $("resultScreen")
        .classList
        .add("hidden");


    money = 0;
    fame = 0;
    streak = 0;

    currentEnemy = 0;

    updateHud();

    prepareRound();

}


/* KAZAN */

function winRound(){

    if(!playing)
        return;


    playing = false;

    canShoot = false;

    clearTimeout(timer);

    clearTimeout(enemyTimer);


    const enemy =
        enemies[
            Math.min(
                currentEnemy,
                enemies.length - 1
            )
        ];


    /* SEN GERÇEKTEN ÇEKİYORSUN */

    drawPlayer();


    $("health").style.width =
        "0%";


    $("enemy")
        .classList
        .add("hit");


    setTimeout(()=>{

        $("enemy")
            .classList
            .remove("hit");

    },260);


    streak++;

    money += enemy.reward;

    fame +=
        5 +
        streak * 2;


    updateHud();


    /* YENİ RAKİP */

    const newEnemy =
        streak > 0 &&
        streak % 3 === 0 &&
        currentEnemy <
        enemies.length - 1;


    setText(
        "VURDUN!",
        "Rakibinden daha hızlısın."
    );


    setTimeout(()=>{

        $("resultTitle").textContent =
            newEnemy
            ? "🏆"
            : "💥";


        if(newEnemy){

            $("resultText").innerHTML =

                "<b>" +
                enemy.name +
                "</b> düştü!" +

                "<br><br>" +

                "Yeni rakip geliyor: " +

                "<b>" +
                enemies[
                    currentEnemy + 1
                ].name +
                "</b>" +

                "<br><br>" +

                "💰 +" +
                enemy.reward +

                " &nbsp; ⭐ +" +

                (
                    5 +
                    streak * 2
                );

        }else{

            $("resultText").innerHTML =

                "<b>" +
                enemy.name +
                "</b> düştü!" +

                "<br><br>" +

                "💰 +" +
                enemy.reward +

                " &nbsp; ⭐ +" +

                (
                    5 +
                    streak * 2
                ) +

                "<br>" +

                "🔥 Seri: " +
                streak;

        }


        $("resultScreen")
            .classList
            .remove("hidden");


        if(newEnemy)
            currentEnemy++;


    },650);

}


/* ERKEN ATEŞ */

function loseEarly(){

    if(!playing)
        return;


    playing = false;

    canShoot = false;

    clearTimeout(timer);

    clearTimeout(enemyTimer);


    streak = 0;

    updateHud();


    drawEnemy();


    setText(
        "ERKEN ATEŞ!",
        "Rakibin seni vurdu."
    );


    setTimeout(()=>{

        $("resultTitle").textContent =
            "💀";


        $("resultText").innerHTML =

            "Silahına çok erken davrandın." +

            "<br><br>" +

            "🔥 Seri sıfırlandı.";


        $("resultScreen")
            .classList
            .remove("hidden");

    },600);

}


/* KAYBET */

function endRound(
    win,
    text
){

    if(!playing)
        return;


    playing = false;

    canShoot = false;

    clearTimeout(timer);

    clearTimeout(enemyTimer);


    streak = 0;

    updateHud();


    setText(
        win
        ? "KAZANDIN!"
        : "KAYBETTİN!",
        text
    );


    setTimeout(()=>{

        $("resultTitle").textContent =
            win
            ? "🤠"
            : "💀";


        $("resultText").textContent =
            text;


        $("resultScreen")
            .classList
            .remove("hidden");


    },650);

}


/* ÇEK */

function shoot(){

    if(!playing)
        return;


    if(!canShoot){

        sound(
            130,
            .06
        );

        loseEarly();

        return;

    }


    winRound();

}


/* BUTONLAR */

$("startButton")
    .addEventListener(
        "click",
        ()=>{
            sound(440,.06);
            startGame();
        }
    );


$("againButton")
    .addEventListener(
        "click",
        ()=>{

            sound(440,.06);

            $("resultScreen")
                .classList
                .add("hidden");

            prepareRound();

        }
    );


$("fireButton")
    .addEventListener(
        "click",
        shoot
    );


/* KLAVYE */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.code === "Space" ||
            event.code === "Enter"
        ){

            event.preventDefault();

            shoot();

        }

    }
);


updateHud();

</script>

</body>
</html>
