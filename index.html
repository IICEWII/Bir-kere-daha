<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>SON KURŞUN</title>

<style>

* {
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#120b08;
    font-family:Georgia,serif;
}

body {
    color:#f5dfad;
}

.game {
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
        linear-gradient(
            rgba(20,8,4,.15),
            rgba(20,8,4,.72)
        ),
        url("western-bg.png") center center / cover no-repeat;
}

/* KARARTMA */

.game::after {
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at center,
            transparent 30%,
            rgba(0,0,0,.72) 100%
        );
}

/* ÜST BAR */

.topbar {
    position:absolute;
    z-index:5;

    top:14px;
    left:14px;
    right:14px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:10px 15px;

    background:
        linear-gradient(
            rgba(35,21,15,.96),
            rgba(20,12,9,.96)
        );

    border:1px solid #9b7040;
    border-radius:9px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.55),
        inset 0 1px rgba(255,220,150,.18);
}

.logo {
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;

    color:#e8c178;

    text-shadow:
        2px 2px #000;
}

.stats {
    display:flex;
    gap:14px;
    font-size:13px;
}

.stat {
    display:flex;
    align-items:center;
    gap:4px;
}

/* RAKİP */

.enemy {
    position:absolute;
    z-index:4;

    top:17%;
    left:50%;

    transform:translateX(-50%);

    text-align:center;

    width:90%;
}

.enemy-name {
    font-size:31px;
    font-weight:bold;
    letter-spacing:3px;

    text-shadow:
        3px 3px 0 #1a0905,
        0 0 15px rgba(0,0,0,.8);
}

.enemy-title {
    margin-top:5px;

    font-size:14px;

    color:#d9bb83;
}

/* CAN */

.health {
    width:190px;
    height:8px;

    margin:12px auto;

    background:#1b0d08;

    border:1px solid #6e4126;
    border-radius:8px;

    overflow:hidden;
}

.health-fill {
    height:100%;
    width:100%;

    background:#a9281e;

    transition:.3s;
}

/* DURUM */

.status {
    position:absolute;
    z-index:6;

    top:38%;
    left:50%;

    transform:translateX(-50%);

    text-align:center;

    width:100%;
}

.message {
    font-size:34px;
    font-weight:bold;

    letter-spacing:3px;

    text-shadow:
        3px 3px 0 #1a0905,
        0 0 20px rgba(0,0,0,.8);
}

.submessage {
    margin-top:8px;

    font-size:14px;

    color:#e5cc9b;
}

/* OYUNCU */

.player {
    position:absolute;
    z-index:4;

    bottom:3%;
    left:50%;

    transform:translateX(-50%);

    width:100%;
    text-align:center;
}

.player-label {
    font-size:13px;
    letter-spacing:3px;

    color:#c9a66d;
}

/* TABANCA */

.gun-holster {
    position:relative;

    width:170px;
    height:100px;

    margin:0 auto 5px;

    opacity:.95;
}

.gun {
    position:absolute;

    width:115px;
    height:25px;

    right:5px;
    bottom:25px;

    background:
        linear-gradient(
            #3b3935,
            #141312
        );

    border:3px solid #0b0908;

    border-radius:4px;

    transform:rotate(-12deg);

    box-shadow:
        0 6px 12px rgba(0,0,0,.7);
}

.gun::after {
    content:"";

    position:absolute;

    width:25px;
    height:42px;

    right:65px;
    top:18px;

    background:
        linear-gradient(
            90deg,
            #6e4226,
            #2b170d
        );

    border:2px solid #140b07;

    transform:rotate(28deg);
}

/* ÇEK BUTONU */

.fire-area {
    position:absolute;
    z-index:10;

    bottom:15%;
    left:50%;

    transform:translateX(-50%);

    text-align:center;
}

.fire-button {

    width:145px;
    height:145px;

    border-radius:50%;

    border:7px solid #21110b;

    background:
        radial-gradient(
            circle at 35% 30%,
            #eac77c,
            #a96c2d 52%,
            #482012
        );

    color:#28130b;

    font-family:Georgia,serif;

    font-size:26px;
    font-weight:bold;

    box-shadow:
        0 8px 0 #160b07,
        0 15px 35px rgba(0,0,0,.65),
        inset 0 2px rgba(255,240,180,.5);

    transition:.08s;
}

.fire-button:active {
    transform:translateY(7px);

    box-shadow:
        0 2px 0 #160b07;
}

.fire-button.ready {

    animation:
        readyPulse .35s infinite alternate;

}

@keyframes readyPulse {

    from {
        transform:scale(1);
        box-shadow:
            0 8px 0 #160b07,
            0 0 15px #d9a642;
    }

    to {
        transform:scale(1.07);
        box-shadow:
            0 8px 0 #160b07,
            0 0 45px #ffcf64;
    }

}

/* DUELLO BAŞLANGIÇ */

.overlay {

    position:absolute;
    z-index:50;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        rgba(13,7,4,.78);

    backdrop-filter:blur(4px);
}

.panel {

    width:100%;
    max-width:420px;

    padding:32px 24px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #3c2417,
            #1b100b
        );

    border:2px solid #9c713e;

    border-radius:12px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.8),
        inset 0 1px rgba(255,230,170,.15);
}

.panel h1 {

    margin:0;

    font-size:42px;

    letter-spacing:3px;

    color:#e8c178;

    text-shadow:
        3px 3px #160906;
}

.panel p {

    color:#d8c29a;

    line-height:1.6;
}

.start-button {

    margin-top:15px;

    padding:16px 30px;

    border:2px solid #b9894c;

    border-radius:7px;

    background:#9c602a;

    color:#fff0c9;

    font-family:Georgia,serif;

    font-weight:bold;
    font-size:17px;

    box-shadow:
        0 5px 0 #3b1b0e;
}

.start-button:active {
    transform:translateY(5px);
    box-shadow:none;
}

/* SONUÇ */

.result-title {
    font-size:38px;
    margin-bottom:10px;
}

.hidden {
    display:none!important;
}

/* BLÖF */

.bluff {

    animation:
        handMove .35s ease-in-out;

}

@keyframes handMove {

    0% {
        transform:translateX(-50%);
    }

    50% {
        transform:
            translateX(-50%)
            translateY(-8px);
    }

    100% {
        transform:translateX(-50%);
    }

}

/* VURUŞ */

.hit {

    animation:
        damage .35s;

}

@keyframes damage {

    0% {
        transform:translateX(-50%);
    }

    25% {
        transform:translateX(calc(-50% - 15px));
    }

    50% {
        transform:translateX(calc(-50% + 15px));
    }

    75% {
        transform:translateX(calc(-50% - 8px));
    }

    100% {
        transform:translateX(-50%);
    }

}

/* MOBİL */

@media(max-height:700px) {

    .enemy {
        top:13%;
    }

    .status {
        top:34%;
    }

    .fire-area {
        bottom:9%;
    }

    .fire-button {
        width:115px;
        height:115px;
        font-size:21px;
    }

    .enemy-name {
        font-size:25px;
    }

}

</style>
</head>

<body>

<div class="game" id="game">

    <div class="topbar">

        <div class="logo">
            SON KURŞUN
        </div>

        <div class="stats">

            <div class="stat">
                ⭐ <span id="fame">0</span>
            </div>

            <div class="stat">
                💰 <span id="money">0</span>
            </div>

            <div class="stat">
                🔥 <span id="streak">0</span>
            </div>

        </div>

    </div>


    <!-- RAKİP -->

    <div class="enemy" id="enemy">

        <div class="enemy-name" id="enemyName">
            BILLY KANE
        </div>

        <div class="enemy-title" id="enemyTitle">
            Kasabanın en hızlısı
        </div>

        <div class="health">
            <div
                class="health-fill"
                id="health">
            </div>
        </div>

    </div>


    <!-- DURUM -->

    <div class="status">

        <div
            class="message"
            id="message">
            HAZIR OL...
        </div>

        <div
            class="submessage"
            id="submessage">
            Rakibini izle.
        </div>

    </div>


    <!-- OYUNCU -->

    <div class="player">

        <div class="gun-holster">

            <div class="gun"></div>

        </div>

        <div class="player-label">
            SEN
        </div>

    </div>


    <!-- BUTON -->

    <div class="fire-area">

        <button
            class="fire-button"
            id="fireButton">

            ÇEK!

        </button>

    </div>


    <!-- BAŞLANGIÇ -->

    <div
        class="overlay"
        id="startScreen">

        <div class="panel">

            <h1>🤠</h1>

            <h1>
                SON KURŞUN
            </h1>

            <p>
                Kasabanın en hızlı silahşoru
                olduğunu kanıtla.
            </p>

            <p>
                Rakibinin blöflerine dikkat et.
                <br>
                <b>ATEŞ!</b> anını bekle.
            </p>

            <button
                class="start-button"
                id="startButton">

                DÜELLOYA BAŞLA

            </button>

        </div>

    </div>


    <!-- SONUÇ -->

    <div
        class="overlay hidden"
        id="resultScreen">

        <div class="panel">

            <div
                class="result-title"
                id="resultTitle">
                💀
            </div>

            <p id="resultText"></p>

            <button
                class="start-button"
                id="againButton">

                TEKRAR DÜELLO

            </button>

        </div>

    </div>

</div>


<script>

/* ===============================
   OYUN
================================ */

let playing = false;
let canShoot = false;

let timer = null;

let score = 0;
let money = 0;
let fame = 0;
let streak = 0;

let currentEnemy = 0;


/* ===============================
   RAKİPLER
================================ */

const enemies = [

    {
        name:"BILLY KANE",
        title:"Kasabanın en hızlısı",
        reaction:720,
        bluff:.12
    },

    {
        name:"JACK DALTON",
        title:"Sinsi kumarbaz",
        reaction:610,
        bluff:.20
    },

    {
        name:"MAD DOG",
        title:"Ne zaman ateş edeceği belli değil",
        reaction:520,
        bluff:.28
    },

    {
        name:"BLACK JACK",
        title:"Üç kasabanın aranan adamı",
        reaction:440,
        bluff:.35
    },

    {
        name:"EL DIABLO",
        title:"Efsane silahşor",
        reaction:360,
        bluff:.42
    }

];


/* ===============================
   ELEMENTLER
================================ */

const message =
    document.getElementById("message");

const submessage =
    document.getElementById("submessage");

const fireButton =
    document.getElementById("fireButton");

const enemy =
    document.getElementById("enemy");

const enemyName =
    document.getElementById("enemyName");

const enemyTitle =
    document.getElementById("enemyTitle");

const health =
    document.getElementById("health");

const fameText =
    document.getElementById("fame");

const moneyText =
    document.getElementById("money");

const streakText =
    document.getElementById("streak");

const startScreen =
    document.getElementById("startScreen");

const resultScreen =
    document.getElementById("resultScreen");

const resultTitle =
    document.getElementById("resultTitle");

const resultText =
    document.getElementById("resultText");

const startButton =
    document.getElementById("startButton");

const againButton =
    document.getElementById("againButton");


/* ===============================
   BAŞLAT
================================ */

startButton.onclick = () => {

    startScreen.classList.add("hidden");

    playing = true;

    startDuel();

};


/* ===============================
   DÜELLO
================================ */

function startDuel() {

    clearTimeout(timer);

    canShoot = false;

    fireButton.classList.remove("ready");

    const enemyData =
        enemies[
            Math.min(
                currentEnemy,
                enemies.length - 1
            )
        ];


    enemyName.textContent =
        enemyData.name;

    enemyTitle.textContent =
        enemyData.title;

    health.style.width = "100%";


    message.textContent =
        "HAZIR OL...";

    submessage.textContent =
        "Sakın erken ateş etme.";


    /*
       Rakip bazen blöf yapıyor.
    */

    const bluffChance =
        enemyData.bluff +
        Math.min(streak * .015, .15);


    if(Math.random() < bluffChance) {

        const bluffDelay =
            1100 +
            Math.random() * 1800;

        timer = setTimeout(() => {

            enemy.classList.add("bluff");

            message.textContent =
                "🤨";

            submessage.textContent =
                "Rakibin hareket etti...";

            setTimeout(() => {

                enemy.classList.remove("bluff");

                message.textContent =
                    "BEKLE...";

                submessage.textContent =
                    "Bu bir blöf olabilir.";

            }, 400);

        }, bluffDelay);

    }


    /*
       Gerçek ateş zamanı
    */

    const wait =
        1800 +
        Math.random() * 3300;


    timer = setTimeout(() => {

        canShoot = true;

        fireButton.classList.add("ready");

        message.textContent =
            "🔥 ATEŞ!";

        submessage.textContent =
            "ŞİMDİ ÇEK!";


        /*
           Rakibin tepki süresi.
           Seri arttıkça zorlaşır.
        */

        const difficulty =
            Math.min(
                streak * 18,
                180
            );

        const reaction =
            Math.max(
                250,
                enemyData.reaction -
                difficulty +
                Math.random() * 100
            );


        timer = setTimeout(() => {

            if(canShoot) {

                lose(
                    "Rakibin senden önce çekti!"
                );

            }

        }, reaction);


    }, wait);

}


/* ===============================
   ATEŞ
================================ */

fireButton.addEventListener(
    "pointerdown",
    shoot
);


function shoot(e) {

    e.preventDefault();

    if(!playing)
        return;


    /*
       ERKEN ATEŞ
    */

    if(!canShoot) {

        clearTimeout(timer);

        lose(
            "Çok erken ateş ettin!"
        );

        return;

    }


    /*
       DOĞRU ATIŞ
    */

    clearTimeout(timer);

    canShoot = false;

    fireButton.classList.remove("ready");


    const enemyData =
        enemies[
            Math.min(
                currentEnemy,
                enemies.length - 1
            )
        ];


    /*
       Ödül
    */

    const reward =
        100 +
        streak * 30;


    score += reward;

    money += 25 + streak * 5;

    fame += 1;

    streak++;


    fameText.textContent =
        fame;

    moneyText.textContent =
        money;

    streakText.textContent =
        streak;


    health.style.width = "0%";


    message.textContent =
        "💥 VURDUN!";

    submessage.textContent =
        "+" + reward + " puan";


    /*
       Rakip ilerliyor.
    */

    if(
        streak === 3 ||
        streak === 6 ||
        streak === 10
    ) {

        currentEnemy =
            Math.min(
                currentEnemy + 1,
                enemies.length - 1
            );

    }


    /*
       Sonraki düello
    */

    setTimeout(() => {

        startDuel();

    }, 950);

}


/* ===============================
   KAYBET
================================ */

function lose(reason) {

    clearTimeout(timer);

    playing = false;

    canShoot = false;

    fireButton.classList.remove("ready");


    resultTitle.textContent =
        "💀 DUELLO BİTTİ";


    resultText.innerHTML =
        reason +
        "<br><br>" +

        "⭐ Ün: <b>" +
        fame +
        "</b><br>" +

        "💰 Para: <b>" +
        money +
        "</b><br>" +

        "🔥 Seri: <b>" +
        streak +
        "</b>";


    resultScreen.classList.remove(
        "hidden"
    );

}


/* ===============================
   YENİ OYUN
================================ */

againButton.onclick = () => {

    resultScreen.classList.add(
        "hidden"
    );

    score = 0;
    money = 0;
    fame = 0;
    streak = 0;
    currentEnemy = 0;

    fameText.textContent = "0";
    moneyText.textContent = "0";
    streakText.textContent = "0";

    playing = true;

    startDuel();

};

</script>

</body>
</html>
