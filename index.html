<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BİR KERE DAHA 😈</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b0d12;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  touch-action: none;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #10131a;
  border-bottom: 1px solid #292e39;
}

.title {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 2px;
}

.stats {
  text-align: right;
  font-size: 11px;
  line-height: 1.5;
  color: #aeb5c2;
}

.stats b {
  color: white;
}

#gameArea {
  position: relative;
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
}

canvas {
  width: min(100%, 420px);
  height: min(100%, 720px);
  aspect-ratio: 420 / 720;
  background: #151923;
  border: 1px solid #2b3140;
  border-radius: 18px;
  box-shadow: 0 18px 50px #0008;
  touch-action: none;
}

#message {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 85%;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s;
}

#message.show {
  opacity: 1;
}

#message .big {
  font-size: 30px;
  font-weight: 1000;
  text-shadow: 0 4px 18px black;
}

#message .small {
  margin-top: 8px;
  color: #c5cad4;
  font-size: 14px;
}

#panel {
  position: absolute;
  inset: 0;
  background: #0b0d12ee;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: min(92%, 390px);
  background: #151923;
  border: 1px solid #343b4b;
  border-radius: 24px;
  padding: 28px;
  text-align: center;
  box-shadow: 0 24px 80px #000b;
}

.card h1 {
  margin: 0 0 10px;
  font-size: 30px;
}

.card p {
  color: #b8beca;
  line-height: 1.5;
}

button {
  border: 0;
  border-radius: 14px;
  background: white;
  color: #0b0d12;
  padding: 14px 22px;
  font-size: 16px;
  font-weight: 900;
  margin-top: 12px;
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="title">BİR KERE DAHA 😈</div>

  <div class="stats">
    <div id="level">BÖLÜM 1 / 12</div>
    <div>
      ÖLÜM <b id="deaths">0</b>
      ·
      SÜRE <b id="time">00:00</b>
    </div>
  </div>
</header>

<div id="gameArea">

<canvas id="game" width="420" height="720"></canvas>

<div id="message">
  <div class="big" id="messageBig"></div>
  <div class="small" id="messageSmall"></div>
</div>

<div id="panel">

  <div class="card">

    <h1 id="panelTitle">BİTTİ.</h1>

    <p id="panelText"></p>

    <button id="panelButton">
      BİR KERE DAHA 😈
    </button>

  </div>

</div>

</div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 420;
const H = 720;

const ball = {
  x: 55,
  y: 665,
  r: 15
};

let level = 0;
let deaths = 0;
let hardMode = false;
let gameFinished = false;
let dragging = false;

let gameStart = performance.now();
let levelStart = performance.now();

const levels = [

{
  target:[350,80,42],
  walls:[
    [90,570,240,18],
    [40,420,170,18]
  ],
  text:"Kolay. Şimdilik."
},

{
  target:[350,105,42],
  walls:[
    [90,560,250,18],
    [70,430,18,150]
  ],
  text:"Hedefe git."
},

{
  target:[330,160,42],
  walls:[
    [80,560,260,18],
    [300,300,18,280],
    [55,280,190,18]
  ],
  text:"Duvarlar burada."
},

{
  target:[335,90,42],
  walls:[
    [70,590,280,18],
    [60,430,18,160],
    [250,430,18,160]
  ],
  invisible:[
    [180,510,120,18]
  ],
  text:"Bazı şeyleri göremeyebilirsin."
},

{
  target:[80,120,42],
  fake:[330,100,42],
  walls:[
    [110,570,250,18],
    [110,390,18,180],
    [290,250,18,320]
  ],
  text:"Yeşil gördüğün her şey hedef değil."
},

{
  target:[350,610,42],
  walls:[
    [80,520,260,18],
    [80,300,18,220],
    [320,170,18,350]
  ],
  moving:true,
  text:"Ezberleme. Değişiyor."
},

{
  target:[70,90,42],
  walls:[],
  fakeWall:true,
  text:"BU BÖLÜMDE DUVAR YOK."
},

{
  target:[350,100,42],
  walls:[
    [80,560,260,18],
    [80,380,18,180],
    [300,200,18,360]
  ],
  freezeTarget:true,
  text:"Topu bırakırsan hedef de durur."
},

{
  target:[340,90,42],
  walls:[
    [70,590,280,18],
    [70,390,18,200],
    [270,390,18,200]
  ],
  hiddenTarget:true,
  text:"Beni bul."
},

{
  target:[350,100,42],
  walls:[
    [70,590,280,18],
    [70,420,150,18],
    [280,260,18,330]
  ],
  fakeFinish:true,
  text:"BÖLÜM TAMAMLANDI ✓"
},

{
  target:[350,630,42],
  walls:[
    [70,500,280,18],
    [70,300,18,200],
    [300,180,18,320]
  ],
  moving:true,
  text:"Son bir tane."
},

{
  target:[350,80,42],
  walls:[
    [70,600,280,18],
    [70,430,18,170],
    [300,250,18,350],
    [160,250,140,18]
  ],
  final:true,
  text:"Bunu gerçekten bitirebilecek misin?"
}

];

const hardLevels = [

{
  target:[350,70,34],
  walls:[
    [65,600,290,18],
    [65,450,18,150],
    [285,450,18,150]
  ],
  text:"Zor mod. Şimdi ciddiyiz."
},

{
  target:[60,110,34],
  walls:[
    [90,600,240,16],
    [90,400,16,200],
    [300,240,16,360],
    [140,240,160,16]
  ],
  text:"Daha küçük."
},

{
  target:[350,120,34],
  walls:[
    [70,580,280,16],
    [70,380,16,200],
    [220,380,16,200],
    [220,220,130,16]
  ],
  moving:true,
  text:"Daha hızlı."
},

{
  target:[60,90,34],
  walls:[
    [70,600,280,16],
    [70,440,16,160],
    [300,300,16,300],
    [120,300,180,16]
  ],
  invisible:[
    [170,520,100,16]
  ],
  text:"Bir şey eksik."
},

{
  target:[350,650,34],
  walls:[
    [80,520,260,16],
    [80,300,16,220],
    [300,180,16,340]
  ],
  text:"Güvenme."
},

{
  target:[350,90,34],
  walls:[
    [60,610,300,16],
    [60,440,16,170],
    [250,440,16,170],
    [120,250,130,16]
  ],
  final:true,
  text:"Bitti sanıyorsun."
}

];

function getLevel(){

  if(hardMode){
    return hardLevels[level - 12];
  }

  return levels[level];
}

function resetBall(){

  ball.x = 55;
  ball.y = H - 55;

  dragging = false;
}

function showMessage(big, small, duration){

  messageBig.textContent = big;
  messageSmall.textContent = small;

  message.classList.add("show");

  clearTimeout(showMessage.timer);

  showMessage.timer = setTimeout(function(){

    message.classList.remove("show");

  }, duration || 700);

}

function formatTime(ms){

  let seconds = Math.floor(ms / 1000);

  let minutes = Math.floor(seconds / 60);

  seconds %= 60;

  return String(minutes).padStart(2,"0")
       + ":"
       + String(seconds).padStart(2,"0");
}

function circleRect(cx,cy,r,rx,ry,rw,rh){

  const x = Math.max(rx,Math.min(cx,rx+rw));

  const y = Math.max(ry,Math.min(cy,ry+rh));

  return (
    (cx-x)*(cx-x) +
    (cy-y)*(cy-y)
  ) < r*r;
}

function movingWall(w,index){

  if(!getLevel().moving){
    return w;
  }

  const movement =
    Math.sin(performance.now()/600 + index) * 45;

  return [
    w[0],
    w[1] + movement,
    w[2],
    w[3]
  ];
}

function getTarget(){

  const data = getLevel();

  if(
    data.hiddenTarget &&
    performance.now() - levelStart < 900
  ){
    return null;
  }

  let t = data.target;

  if(data.freezeTarget && dragging){

    t = [
      t[0] + Math.sin(performance.now()/350)*28,
      t[1] + Math.cos(performance.now()/500)*18,
      t[2]
    ];

  }

  return t;
}

function collision(){

  const data = getLevel();

  for(let i=0;i<data.walls.length;i++){

    const wall =
      movingWall(data.walls[i],i);

    if(
      circleRect(
        ball.x,
        ball.y,
        ball.r,
        wall[0],
        wall[1],
        wall[2],
        wall[3]
      )
    ){

      return true;
    }
  }

  if(data.invisible){

    for(const wall of data.invisible){

      if(
        circleRect(
          ball.x,
          ball.y,
          ball.r,
          wall[0],
          wall[1],
          wall[2],
          wall[3]
        )
      ){

        return true;
      }
    }
  }

  return false;
}

function lose(){

  deaths++;

  deathsElement.textContent = deaths;

  showMessage(
    "HAYIR. 😈",
    getLevel().text || "DUVAR ORADAYDI.",
    650
  );

  resetBall();
}

function completeLevel(){

  if(gameFinished){
    return;
  }

  gameFinished = true;

  const data = getLevel();

  if(data.fakeFinish){

    showMessage(
      "BÖLÜM TAMAMLANDI ✓",
      "...ama biraz erken sevindin.",
      900
    );

    setTimeout(function(){

      gameFinished = false;

      level++;

      levelStart = performance.now();

      resetBall();

      updateLevel();

    },950);

    return;
  }

  if(
    level <
    (hardMode ? 17 : 11)
  ){

    showMessage(
      "GEÇTİN. 😏",
      "Bir sonraki daha kötü.",
      700
    );

    setTimeout(function(){

      gameFinished = false;

      level++;

      levelStart = performance.now();

      resetBall();

      updateLevel();

    },750);

  }else{

    finishGame();

  }
}

function finishGame(){

  const total =
    formatTime(performance.now()-gameStart);

  panel.style.display = "flex";

  panelTitle.textContent =
    hardMode
    ? "ZOR MOD BİTTİ."
    : "BİTTİ.";

  panelText.innerHTML =
    (hardMode
      ? "Saygı duydum. 😈"
      : "Fena değildi.")
    +
    "<br><br>"
    +
    "<b>" + deaths + " ölüm</b>"
    +
    "<br>"
    +
    "<b>" + total + "</b>";

  panelButton.textContent =
    hardMode
    ? "BAŞTAN OYNA"
    : "BİR KERE DAHA 😈";
}

function updateLevel(){

  if(hardMode){

    levelElement.textContent =
      "ZOR MOD · " +
      (level - 11) +
      " / 6";

  }else{

    levelElement.textContent =
      "BÖLÜM " +
      (level + 1) +
      " / 12";
  }
}

function startNormal(){

  panel.style.display = "none";

  hardMode = false;

  level = 0;

  deaths = 0;

  gameFinished = false;

  deathsElement.textContent = "0";

  gameStart = performance.now();

  levelStart = gameStart;

  resetBall();

  updateLevel();
}

function startHard(){

  panel.style.display = "none";

  hardMode = true;

  level = 12;

  deaths = 0;

  gameFinished = false;

  deathsElement.textContent = "0";

  gameStart = performance.now();

  levelStart = gameStart;

  resetBall();

  updateLevel();
}

function getPointer(event){

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:
      (event.clientX - rect.left)
      * W / rect.width,

    y:
      (event.clientY - rect.top)
      * H / rect.height

  };
}

canvas.addEventListener(
  "pointerdown",
  function(event){

    const p = getPointer(event);

    const distance =
      Math.hypot(
        p.x-ball.x,
        p.y-ball.y
      );

    if(distance < 35){

      dragging = true;

      canvas.setPointerCapture(
        event.pointerId
      );
    }

  }
);

canvas.addEventListener(
  "pointermove",
  function(event){

    if(!dragging || gameFinished){
      return;
    }

    const p = getPointer(event);

    ball.x =
      Math.max(
        ball.r,
        Math.min(
          W-ball.r,
          p.x
        )
      );

    ball.y =
      Math.max(
        ball.r,
        Math.min(
          H-ball.r,
          p.y
        )
      );

    if(collision()){

      lose();

      return;
    }

    const target = getTarget();

    if(!target){
      return;
    }

    const distance =
      Math.hypot(
        ball.x-target[0],
        ball.y-target[1]
      );

    if(
      distance <
      ball.r + target[2]*0.52
    ){

      if(getLevel().fakeWall){

        showMessage(
          "DUVAR YOKTU DEMİŞTİK. 😇",
          "Ama şimdi var.",
          700
        );

        lose();

        return;
      }

      if(getLevel().fake){

        const fakeDistance =
          Math.hypot(
            ball.x-getLevel().fake[0],
            ball.y-getLevel().fake[1]
          );

        if(fakeDistance <
           ball.r + getLevel().fake[2]*0.52){

          lose();

          return;
        }
      }

      completeLevel();
    }

  }
);

canvas.addEventListener(
  "pointerup",
  function(){

    dragging = false;

  }
);

canvas.addEventListener(
  "pointercancel",
  function(){

    dragging = false;

  }
);

panelButton.onclick = function(){

  if(!hardMode){

    startHard();

  }else{

    startNormal();

  }

};

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.fillStyle = "#151923";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /*
   GRID
  */

  ctx.strokeStyle = "#1d2230";

  ctx.lineWidth = 1;

  for(let x=0;x<W;x+=30){

    ctx.beginPath();

    ctx.moveTo(x,0);

    ctx.lineTo(x,H);

    ctx.stroke();
  }

  for(let y=0;y<H;y+=30){

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(W,y);

    ctx.stroke();
  }

  const data = getLevel();

  /*
   TARGET
  */

  const target = getTarget();

  if(target){

    ctx.beginPath();

    ctx.arc(
      target[0],
      target[1],
      target[2],
      0,
      Math.PI*2
    );

    ctx.fillStyle = "#35d07f";

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      target[0],
      target[1],
      target[2]*0.48,
      0,
      Math.PI*2
    );

    ctx.fillStyle = "#9affc5";

    ctx.fill();
  }

  /*
   FAKE TARGET
  */

  if(data.fake){

    ctx.beginPath();

    ctx.arc(
      data.fake[0],
      data.fake[1],
      data.fake[2],
      0,
      Math.PI*2
    );

    ctx.fillStyle = "#35d07f";

    ctx.fill();
  }

  /*
   WALLS
  */

  for(
    let i=0;
    i<data.walls.length;
    i++
  ){

    const wall =
      movingWall(
        data.walls[i],
        i
      );

    ctx.fillStyle = "#d7dbe3";

    ctx.fillRect(
      wall[0],
      wall[1],
      wall[2],
      wall[3]
    );
  }

  /*
   INVISIBLE WALLS
  */

  if(data.invisible){

    ctx.fillStyle = "#232936";

    for(
      const wall of data.invisible
    ){

      ctx.fillRect(
        wall[0],
        wall[1],
        wall[2],
        wall[3]
      );
    }
  }

  /*
   FAKE WALL
  */

  if(
    data.fakeWall &&
    dragging
  ){

    ctx.fillStyle = "#d7dbe3";

    ctx.fillRect(
      150,
      280,
      18,
      300
    );
  }

  /*
   BALL
  */

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI*2
  );

  ctx.fillStyle = "#050608";

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    ball.x-5,
    ball.y-5,
    4,
    0,
    Math.PI*2
  );

  ctx.fillStyle = "#4d5360";

  ctx.fill();

  /*
   TEXT
  */

  ctx.fillStyle = "#7e8798";

  ctx.font =
    "700 12px Arial";

  ctx.textAlign = "center";

  ctx.fillText(
    data.text || "YEŞİL ALANA ULAŞ",
    W/2,
    H-16
  );

  /*
   TIME
  */

  timeElement.textContent =
    formatTime(
      performance.now()-gameStart
    );

  requestAnimationFrame(draw);
}

const deathsElement =
  document.getElementById("deaths");

const timeElement =
  document.getElementById("time");

const levelElement =
  document.getElementById("level");

const message =
  document.getElementById("message");

const messageBig =
  document.getElementById("messageBig");

const messageSmall =
  document.getElementById("messageSmall");

const panel =
  document.getElementById("panel");

const panelTitle =
  document.getElementById("panelTitle");

const panelText =
  document.getElementById("panelText");

const panelButton =
  document.getElementById("panelButton");

startNormal();

draw();

</script>

</body>
</html>
