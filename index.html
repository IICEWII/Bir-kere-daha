<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vahşi Batı - Son Kurşun</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, serif;
    background:
        radial-gradient(circle at 50% 35%, #d9a45b 0%, #9a542d 45%, #321813 100%);
    color: #fff4d6;
}

.game {
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
}

.sky {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(255,196,91,.15),
            rgba(50,20,10,.4)
        );
    pointer-events: none;
}

/* ÜST BİLGİ */

.top {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 18px;
    background: rgba(45,20,12,.72);
    border-bottom: 2px solid rgba(255,218,151,.25);
}

.logo {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
}

.stats {
    display: flex;
    gap: 12px;
    font-size: 14px;
}

/* ARENA */

.arena {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    padding: 20px;
}

/* GÜNEŞ */

.sun {
    position: absolute;
    top: 7%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #ffd36b;
    box-shadow: 0 0 45px rgba(255,194,72,.7);
    opacity: .8;
}

/* RAKİP */

.enemy-area,
.player-area {
    width: 100%;
    max-width: 500px;
    text-align: center;
    position: relative;
    z-index: 2;
}

.name {
    font-size: 21px;
    font-weight: bold;
    text-shadow: 2px 2px #29120d;
}

.title {
    margin-top: 4px;
    font-size: 13px;
    opacity: .8;
}

.character {
    width: 105px;
    height: 125px;
    margin: 12px auto;
    position: relative;
}

/* KOVBOY */

.head {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #c88354;
    position: absolute;
    left: 25px;
    top: 20px;
    border: 3px solid #512619;
}

.hat {
    position: absolute;
    width: 95px;
    height: 22px;
    background: #4b2719;
    border-radius: 50%;
    left: 5px;
    top: 11px;
    border: 3px solid #29130d;
}

.hat::after {
    content: "";
    position: absolute;
    width: 48px;
    height: 25px;
    background: #4b2719;
    left: 21px;
    bottom: 8px;
    border-radius: 5px;
    border: 3px solid #29130d;
}

.body {
    width: 68px;
    height: 62px;
    background: #4a2b20;
    position: absolute;
    bottom: 0;
    left: 18px;
    border-radius: 18px 18px 8px 8px;
    border: 3px solid #29130d;
}

.eye {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #21110c;
    border-radius: 50%;
    top: 42px;
}

.eye.left {
    left: 40px;
}

.eye.right {
    right: 40px;
}

/* TABANCA */

.gun {
    width: 65px;
    height: 17px;
    background: #2c211c;
    position: absolute;
    right: -18px;
    bottom: 17px;
    transform: rotate(-8deg);
    border-radius: 3px;
    border: 2px solid #120b08;
}

.gun::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 25px;
    background: #543322;
    right: 42px;
    top: 10px;
    transform: rotate(25deg);
}

/* DURUM */

.status {
    position: relative;
    z-index: 10;
    text-align: center;
    min-height: 90px;
}

.message {
    font-size: 27px;
    font-weight: bold;
    text-shadow: 3px 3px #29120d;
}

.submessage {
    margin-top: 8px;
    font-size: 14px;
    opacity: .85;
}

/* ATEŞ BUTONU */

.fire-button {
    position: relative;
    z-index: 20;
    width: 145px;
    height: 145px;
    border-radius: 50%;
    border: 7px solid #3b1710;
    background:
        radial-gradient(circle, #e8a34b 0%, #a74a22 60%, #5c1c14 100%);
    color: white;
    font-family: Georgia, serif;
    font-size: 24px;
    font-weight: bold;
    box-shadow:
        0 8px 0 #30100c,
        0 15px 30px rgba(0,0,0,.4);
    cursor: pointer;
}

.fire-button:active {
    transform: translateY(7px);
    box-shadow: 0 1px 0 #30100c;
}

.fire-button.ready {
    animation: pulse .45s infinite alternate;
}

@keyframes pulse {
    from {
        transform: scale(1);
        box-shadow: 0 8px 0 #30100c, 0 0 15px #ffcf66;
    }
    to {
        transform: scale(1.08);
        box-shadow: 0 8px 0 #30100c, 0 0 40px #ffd36b;
    }
}

/* EKRANLAR */

.overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: rgba(24,10,7,.88);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.panel {
    width: 100%;
    max-width: 400px;
    text-align: center;
    background: #4b2719;
    border: 3px solid #d49a52;
    border-radius: 16px;
    padding: 28px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.panel h1 {
    font-size: 35px;
    margin: 0 0 10px;
}

.panel p {
    line-height: 1.5;
    opacity: .9;
}

.start-button,
.next-button {
    border: 0;
    border-radius: 10px;
    padding: 16px 30px;
    background: #d08b3d;
    color: #27110c;
    font-size: 18px;
    font-weight: bold;
    font-family: Georgia, serif;
    margin-top: 15px;
}

.hidden {
    display: none !important;
}

/* HASAR */

.hit {
    animation: shake .25s linear;
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-12px); }
    50% { transform: translateX(12px); }
    75% { transform: translateX(-8px); }
    100% { transform: translateX(0); }
}

.flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 40;
}

.flash.active {
    animation: flash .18s;
}

@keyframes flash {
    0% { opacity: .8; }
    100% { opacity: 0; }
}

/* MOBİL */

@media (max-height: 650px) {
    .character {
        transform: scale(.75);
        margin: 0 auto;
    }

    .arena {
        padding: 5px;
    }

    .fire-button {
        width: 120px;
        height: 120px;
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="game">

<div class="sky"></div>

<div class="top">
    <div class="logo">🤠 SON KURŞUN</div>

    <div class="stats">
        <span>🏆 <b id="score">0</b></span>
        <span>🔥 <b id="streak">0</b></span>
    </div>
</div>

<div class="arena">

    <div class="sun"></div>

    <!-- RAKİP -->

    <div class="enemy-area">

        <div class="name" id="enemyName">Billy Kane</div>
        <div class="title" id="enemyTitle">Kasabanın en hızlısı</div>

        <div class="character" id="enemyCharacter">
            <div class="hat"></div>
            <div class="head"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="body"></div>
            <div class="gun"></div>
        </div>

    </div>

    <!-- DURUM -->

    <div class="status">
        <div class="message" id="message">Hazır mısın?</div>
        <div class="submessage" id="submessage">
            Rakibin gözlerini takip et...
        </div>
    </div>

    <!-- OYUNCU -->

    <div class="player-area">

        <div class="character">
            <div class="hat"></div>
            <div class="head"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="body"></div>
            <div class="gun"></div>
        </div>

        <div class="name">SEN</div>

    </div>

    <button class="fire-button" id="fireButton">
        ÇEK!
    </button>

</div>

<!-- FLASH -->

<div class="flash" id="flash"></div>

<!-- BAŞLANGIÇ -->

<div class="overlay" id="startScreen">

    <div class="panel">

        <h1>🤠 SON KURŞUN</h1>

        <p>
            Kasabanın en hızlı silahşoru olduğunu kanıtla.
        </p>

        <p>
            <b>“ATEŞ!”</b> yazısını gördüğünde ateş et.
            <br>
            Erken basarsan kaybedersin.
        </p>

        <button class="start-button" id="startButton">
            DÜELLOYA BAŞLA
        </button>

    </div>

</div>

<!-- SONUÇ -->

<div class="overlay hidden" id="resultScreen">

    <div class="panel">

        <h1 id="resultTitle">💥 VURULDUN</h1>

        <p id="resultText"></p>

        <button class="next-button" id="nextButton">
            TEKRAR DÜELLO
        </button>

    </div>

</div>

</div>

<script>

/* =========================
   OYUN DEĞİŞKENLERİ
========================= */

let gameStarted = false;
let canShoot = false;
let duelTimer = null;

let score = 0;
let streak = 0;

let enemyReaction = 700;

const enemies = [
    {
        name: "Billy Kane",
        title: "Kasabanın en hızlısı",
        reaction: 650
    },
    {
        name: "Jack Dalton",
        title: "Sinsi bir kumarbaz",
        reaction: 850
    },
    {
        name: "Black Jack",
        title: "Üç kasabanın aranan adamı",
        reaction: 550
    },
    {
        name: "Mad Dog",
        title: "Ne zaman ateş edeceği belli değil",
        reaction: 450
    },
    {
        name: "El Diablo",
        title: "Efsane silahşor",
        reaction: 350
    }
];


/* =========================
   ELEMENTLER
========================= */

const startScreen = document.getElementById("startScreen");
const resultScreen = document.getElementById("resultScreen");

const startButton = document.getElementById("startButton");
const nextButton = document.getElementById("nextButton");

const fireButton = document.getElementById("fireButton");

const message = document.getElementById("message");
const submessage = document.getElementById("submessage");

const scoreText = document.getElementById("score");
const streakText = document.getElementById("streak");

const enemyName = document.getElementById("enemyName");
const enemyTitle = document.getElementById("enemyTitle");

const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");

const flash = document.getElementById("flash");


/* =========================
   BAŞLAT
========================= */

startButton.addEventListener("click", () => {

    startScreen.classList.add("hidden");

    gameStarted = true;

    startDuel();

});


/* =========================
   YENİ DÜELLO
========================= */

function startDuel() {

    clearTimeout(duelTimer);

    canShoot = false;

    fireButton.classList.remove("ready");

    message.textContent = "HAZIR OL...";
    submessage.textContent = "Sakın erken ateş etme.";

    const enemy =
        enemies[Math.min(streak, enemies.length - 1)];

    enemyName.textContent = enemy.name;
    enemyTitle.textContent = enemy.title;

    /*
        Rastgele bekleme.
        Oyuncu ne zaman geleceğini bilemez.
    */

    const waitTime =
        1800 + Math.random() * 4000;

    duelTimer = setTimeout(() => {

        canShoot = true;

        message.textContent = "🔥 ATEŞ!";
        submessage.textContent = "ŞİMDİ!";

        fireButton.classList.add("ready");

        /*
            Rakibin ateş süresi.
        */

        const reaction =
            enemy.reaction + Math.random() * 350;

        duelTimer = setTimeout(() => {

            if (canShoot) {

                playerLoses(
                    "Rakibin senden önce çekti!"
                );

            }

        }, reaction);

    }, waitTime);

}


/* =========================
   ATEŞ
========================= */

fireButton.addEventListener("pointerdown", shoot);

function shoot(e) {

    e.preventDefault();

    if (!gameStarted) return;

    /*
        ERKEN ATEŞ
    */

    if (!canShoot) {

        clearTimeout(duelTimer);

        playerLoses(
            "Çok erken ateş ettin!"
        );

        return;

    }

    /*
        DOĞRU ATEŞ
    */

    clearTimeout(duelTimer);

    canShoot = false;

    fireButton.classList.remove("ready");

    flash.classList.add("active");

    setTimeout(() => {
        flash.classList.remove("active");
    }, 200);

    score += 100 + streak * 25;
    streak++;

    scoreText.textContent = score;
    streakText.textContent = streak;

    message.textContent = "💥 VURDUN!";
    submessage.textContent =
        `+${100 + (streak - 1) * 25} puan`;

    /*
        Küçük gecikmeden sonra yeni düello
    */

    setTimeout(() => {

        startDuel();

    }, 1200);

}


/* =========================
   KAYBETME
========================= */

function playerLoses(reason) {

    canShoot = false;

    clearTimeout(duelTimer);

    fireButton.classList.remove("ready");

    gameStarted = false;

    resultTitle.textContent = "💀 DUELLO BİTTİ";

    resultText.innerHTML =
        `${reason}<br><br>
        Skorun: <b>${score}</b><br>
        Serin: <b>${streak}</b>`;

    resultScreen.classList.remove("hidden");

}


/* =========================
   TEKRAR
========================= */

nextButton.addEventListener("click", () => {

    resultScreen.classList.add("hidden");

    score = 0;
    streak = 0;

    scoreText.textContent = "0";
    streakText.textContent = "0";

    gameStarted = true;

    startDuel();

});

</script>

</body>
</html>
