<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">
<title>KAÇ!</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fffdf5;
  font-family:Comic Sans MS, Chalkboard, cursive;
}

body{
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#fffdf5;
}

/* GÖKYÜZÜ */

#sky{
  position:absolute;
  inset:0 0 35%;
  background:#dff4ff;
}

.sun{
  position:absolute;
  width:75px;
  height:75px;
  border:4px solid #222;
  border-radius:50%;
  background:#ffe66d;
  top:8%;
  right:8%;
}

/* UZAK TEPELER */

.hill{
  position:absolute;
  bottom:34%;
  width:240px;
  height:120px;
  border:5px solid #222;
  border-radius:50% 50% 0 0;
  background:#9bd18b;
}

.hill1{left:2%}
.hill2{left:35%;height:150px}
.hill3{left:70%;height:100px}

/* ZEMİN */

#ground{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:35%;
  background:#b7df91;
  border-top:6px solid #222;
}

#road{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:23%;
  background:#ead8ad;
  border-top:5px dashed #555;
}

/* OYUNCU */

#player{
  position:absolute;
  left:15%;
  bottom:23%;
  width:42px;
  height:75px;
  z-index:20;
  transition:transform .08s linear;
}

.head{
  position:absolute;
  width:34px;
  height:34px;
  left:4px;
  top:0;
  border:4px solid #222;
  border-radius:50%;
  background:#ffe0bd;
}

.body{
  position:absolute;
  width:5px;
  height:34px;
  left:19px;
  top:32px;
  background:#222;
}

.arm{
  position:absolute;
  width:5px;
  height:27px;
  top:37px;
  background:#222;
  transform-origin:top;
}

.arm1{
  left:18px;
  transform:rotate(55deg);
}

.arm2{
  left:20px;
  transform:rotate(-55deg);
}

.leg{
  position:absolute;
  width:5px;
  height:31px;
  top:61px;
  background:#222;
  transform-origin:top;
}

.leg1{
  left:18px;
  transform:rotate(28deg);
}

.leg2{
  left:20px;
  transform:rotate(-28deg);
}

/* SİLAH */

.gun{
  display:none;
  position:absolute;
  width:32px;
  height:8px;
  background:#555;
  border:3px solid #222;
  left:25px;
  top:40px;
  transform:rotate(-15deg);
}

.armed .gun{
  display:block;
}

/* NESNELER */

.object{
  position:absolute;
  bottom:23%;
  z-index:10;
}

/* ZOMBİ */

.zombie{
  width:45px;
  height:70px;
}

.zombie .zhead{
  position:absolute;
  width:36px;
  height:36px;
  border:4px solid #222;
  border-radius:50%;
  background:#a8d08d;
  left:4px;
}

.zombie .zbody{
  position:absolute;
  width:7px;
  height:35px;
  background:#222;
  left:18px;
  top:33px;
}

.zombie .zleg{
  position:absolute;
  width:6px;
  height:28px;
  background:#222;
  top:60px;
}

.zombie .zleg1{
  left:17px;
  transform:rotate(25deg);
}

.zombie .zleg2{
  left:22px;
  transform:rotate(-25deg);
}

/* KAZIK */

.spikes{
  width:90px;
  height:45px;
  display:flex;
  align-items:flex-end;
}

.spike{
  width:0;
  height:0;
  border-left:13px solid transparent;
  border-right:13px solid transparent;
  border-bottom:42px solid #e85d5d;
  filter:drop-shadow(2px 2px 0 #222);
}

/* MERMİ */

.ammo{
  width:38px;
  height:38px;
  border:4px solid #222;
  background:#ffd43b;
  border-radius:8px;
  font-size:24px;
  text-align:center;
  line-height:30px;
}

/* BOŞLUK */

.gap{
  position:absolute;
  bottom:0;
  height:35%;
  background:#fffdf5;
  border-left:5px solid #222;
  border-right:5px solid #222;
}

/* MERMİ */

.bullet{
  position:absolute;
  width:14px;
  height:5px;
  background:#222;
  border-radius:5px;
  z-index:30;
}

/* HUD */

#hud{
  position:absolute;
  top:10px;
  left:12px;
  right:12px;
  z-index:100;
  display:flex;
  justify-content:space-between;
  font-size:18px;
  color:#222;
  text-shadow:1px 1px white;
}

.box{
  background:#fff;
  border:3px solid #222;
  border-radius:12px;
  padding:5px 10px;
}

/* MESAJ */

#message{
  position:absolute;
  left:50%;
  top:25%;
  transform:translate(-50%,-50%);
  z-index:200;
  font-size:32px;
  font-weight:bold;
  color:#222;
  background:white;
  border:4px solid #222;
  padding:12px 22px;
  border-radius:15px;
  display:none;
  text-align:center;
}

/* BAŞLANGIÇ */

#start{
  position:absolute;
  inset:0;
  z-index:500;
  background:#fffdf5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

#start h1{
  font-size:70px;
  margin:0;
  transform:rotate(-3deg);
}

#start p{
  font-size:20px;
  max-width:500px;
  padding:0 20px;
}

button{
  font-family:inherit;
  font-size:24px;
  background:#ffe66d;
  border:5px solid #222;
  border-radius:15px;
  padding:12px 30px;
  box-shadow:4px 4px 0 #222;
}

button:active{
  transform:translate(3px,3px);
  box-shadow:1px 1px 0 #222;
}

/* GAME OVER */

#gameover{
  position:absolute;
  inset:0;
  z-index:600;
  background:rgba(255,253,245,.96);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

#gameover h2{
  font-size:50px;
  margin:5px;
}

.stat{
  font-size:22px;
  margin:4px;
}
</style>
</head>

<body>

<div id="game">

  <div id="sky">
    <div class="sun"></div>
    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="hill hill3"></div>
  </div>

  <div id="ground"></div>
  <div id="road"></div>

  <div id="hud">
    <div class="box">📏 <span id="distance">0</span> m</div>
    <div class="box">⏱️ <span id="time">0:00</span></div>
    <div class="box">🔫 <span id="ammo">0</span></div>
  </div>

  <div id="message"></div>

  <div id="player">

    <div class="head"></div>
    <div class="body"></div>
    <div class="arm arm1"></div>
    <div class="arm arm2"></div>
    <div class="leg leg1"></div>
    <div class="leg leg2"></div>
    <div class="gun"></div>

  </div>

  <div id="start">
    <h1>KAÇ!</h1>
    <p>
      Koş. Zıpla. Kaç.<br>
      Ne kadar uzağa gidebilirsin?
    </p>

    <button onclick="startGame()">BAŞLA</button>
  </div>

  <div id="gameover">

    <h2>💀 YAKALANDIN!</h2>

    <div class="stat">
      📏 Mesafe: <b id="finalDistance">0</b> m
    </div>

    <div class="stat">
      ⏱️ Süre: <b id="finalTime">0:00</b>
    </div>

    <div class="stat">
      🧟 Zombi: <b id="kills">0</b>
    </div>

    <div class="stat">
      🏆 Rekor: <b id="record">0</b> m
    </div>

    <br>

    <button onclick="location.reload()">TEKRAR KOŞ</button>

  </div>

</div>

<script>

let running=false;

let playerY=0;
let velocityY=0;
let gravity=.75;

let speed=4;
let distance=0;
let elapsed=0;
let ammo=0;
let kills=0;

let lastTime=0;
let spawnTimer=0;

let objects=[];

let best=parseInt(localStorage.getItem("kac_rekor")||"0");

const player=document.getElementById("player");
const distanceEl=document.getElementById("distance");
const timeEl=document.getElementById("time");
const ammoEl=document.getElementById("ammo");
const message=document.getElementById("message");


function startGame(){

  document.getElementById("start").style.display="none";

  running=true;

  lastTime=performance.now();

  requestAnimationFrame(loop);

  showMessage("KOŞ!");

  setTimeout(()=>{
    showMessage("🧟 ZOMBİLER GELİYOR...");
  },3000);

}


/* ZIPLAMA */

function jump(){

  if(!running) return;

  if(playerY<=1){

    velocityY=14;

  }

}

document.addEventListener("touchstart",function(e){

  e.preventDefault();
  jump();

},{passive:false});

document.addEventListener("mousedown",jump);


/* ANA DÖNGÜ */

function loop(now){

  if(!running)return;

  let dt=Math.min((now-lastTime)/16.67,2);

  lastTime=now;

  elapsed+=dt/60;

  speed+=0.0015*dt;

  playerY+=velocityY*dt;

  velocityY-=gravity*dt;

  if(playerY<0){

    playerY=0;
    velocityY=0;

  }

  player.style.bottom=`calc(23% + ${playerY}px)`;

  distance+=speed*dt*.45;

  distanceEl.textContent=Math.floor(distance);

  let mins=Math.floor(elapsed/60);
  let secs=Math.floor(elapsed%60)
    .toString().padStart(2,"0");

  timeEl.textContent=mins+":"+secs;

  ammoEl.textContent=ammo;

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnObject();

    spawnTimer=Math.max(
      65-speed*5,
      35
    );

  }

  updateObjects(dt);

  requestAnimationFrame(loop);

}


/* NESNE OLUŞTUR */

function spawnObject(){

  let r=Math.random();

  if(r<.40){

    spawnZombie();

  }else if(r<.62){

    spawnSpikes();

  }else if(r<.76){

    spawnAmmo();

  }else if(r<.88){

    spawnGap();

  }else{

    spawnZombie();

  }

}


/* ZOMBİ */

function spawnZombie(){

  const z=document.createElement("div");

  z.className="object zombie";

  z.style.left="105%";

  z.innerHTML=`
    <div class="zhead"></div>
    <div class="zbody"></div>
    <div class="zleg zleg1"></div>
    <div class="zleg zleg2"></div>
  `;

  document.getElementById("game").appendChild(z);

  objects.push({
    el:z,
    x:window.innerWidth+50,
    type:"zombie"
  });

}


/* KAZIK */

function spawnSpikes(){

  const s=document.createElement("div");

  s.className="object spikes";

  s.style.left="105%";

  s.innerHTML=`
    <div class="spike"></div>
    <div class="spike"></div>
    <div class="spike"></div>
  `;

  document.getElementById("game").appendChild(s);

  objects.push({
    el:s,
    x:window.innerWidth+50,
    type:"spike"
  });

}


/* MERMİ */

function spawnAmmo(){

  const a=document.createElement("div");

  a.className="object ammo";

  a.textContent="🔫";

  a.style.left="105%";

  document.getElementById("game").appendChild(a);

  objects.push({
    el:a,
    x:window.innerWidth+50,
    type:"ammo"
  });

}


/* BOŞLUK */

function spawnGap(){

  const g=document.createElement("div");

  g.className="gap";

  g.style.left="105%";
  g.style.width=(90+Math.random()*50)+"px";

  document.getElementById("game").appendChild(g);

  objects.push({
    el:g,
    x:window.innerWidth+50,
    type:"gap"
  });

}


/* NESNELERİ HAREKET ETTİR */

function updateObjects(dt){

  for(let i=objects.length-1;i>=0;i--){

    let o=objects[i];

    o.x-=speed*dt;

    o.el.style.left=o.x+"px";

    /* ZOMBİYE OTOMATİK ATEŞ */

    if(o.type==="zombie" && ammo>0){

      if(o.x<window.innerWidth*.75 &&
         o.x>window.innerWidth*.15){

        shoot(o);

      }

    }

    /* ÇARPIŞMA */

    let rect=o.el.getBoundingClientRect();

    let p=player.getBoundingClientRect();

    if(
      rect.left<p.right-8 &&
      rect.right>p.left+8 &&
      rect.top<p.bottom-8 &&
      rect.bottom>p.top+8
    ){

      if(o.type==="ammo"){

        ammo+=8;

        showMessage("🔫 +8 MERMİ");

        removeObject(i);

        continue;

      }

      if(o.type==="zombie"){

        if(playerY>45){

          continue;

        }

        gameOver();

        return;

      }

      if(o.type==="spike"){

        if(playerY<45){

          gameOver();

          return;

        }

      }

    }

    /* EKRANDAN ÇIKTI */

    if(o.x<-150){

      removeObject(i);

    }

  }

}


/* ATEŞ */

function shoot(zombie){

  if(zombie.dead)return;

  zombie.dead=true;

  ammo--;

  const bullet=document.createElement("div");

  bullet.className="bullet";

  bullet.style.left=
    (window.innerWidth*.15+35)+"px";

  bullet.style.bottom=
    (23+playerY/10)+"%";

  document.getElementById("game").appendChild(bullet);

  let bx=window.innerWidth*.15+35;

  let target=zombie.x;

  let start=bx;

  let interval=setInterval(()=>{

    bx+=14;

    bullet.style.left=bx+"px";

    if(bx>=target){

      clearInterval(interval);

      bullet.remove();

      zombie.el.remove();

      kills++;

      let index=objects.indexOf(zombie);

      if(index!==-1)objects.splice(index,1);

    }

  },16);

}


/* NESNE SİL */

function removeObject(i){

  objects[i].el.remove();

  objects.splice(i,1);

}


/* MESAJ */

function showMessage(text){

  message.textContent=text;

  message.style.display="block";

  setTimeout(()=>{

    message.style.display="none";

  },1400);

}


/* OYUN BİTTİ */

function gameOver(){

  running=false;

  if(distance>best){

    best=Math.floor(distance);

    localStorage.setItem(
      "kac_rekor",
      best
    );

  }

  document.getElementById("finalDistance")
    .textContent=Math.floor(distance);

  document.getElementById("finalTime")
    .textContent=timeEl.textContent;

  document.getElementById("kills")
    .textContent=kills;

  document.getElementById("record")
    .textContent=best;

  document.getElementById("gameover")
    .style.display="flex";

}

</script>

</body>
</html>
