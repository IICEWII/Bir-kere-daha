<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>KAÇ!</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fffdf5;
  font-family: "Comic Sans MS", "Chalkboard SE", cursive;
  touch-action: none;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #fffdf5;
}

/* GÖKYÜZÜ */

#sky {
  position: absolute;
  inset: 0 0 35% 0;
  background: #dff4ff;
}

.sun {
  position: absolute;
  width: 70px;
  height: 70px;
  right: 8%;
  top: 8%;
  border: 4px solid #222;
  border-radius: 50%;
  background: #ffe66d;
}

/* UZAK TEPELER */

.hill {
  position: absolute;
  bottom: 0;
  border: 5px solid #222;
  border-bottom: 0;
  border-radius: 50% 50% 0 0;
  background: #9bd18b;
}

.hill1 {
  left: 0;
  width: 230px;
  height: 110px;
}

.hill2 {
  left: 35%;
  width: 280px;
  height: 145px;
}

.hill3 {
  left: 70%;
  width: 240px;
  height: 95px;
}

/* ZEMİN */

#ground {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 35%;
  background: #b7df91;
  border-top: 6px solid #222;
}

#road {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 23%;
  background: #ead8ad;
  border-top: 5px dashed #555;
}

/* OYUNCU */

#player {
  position: absolute;
  left: 15%;
  bottom: 23%;
  width: 48px;
  height: 80px;
  z-index: 50;
}

.head {
  position: absolute;
  left: 6px;
  top: 0;
  width: 34px;
  height: 34px;
  border: 4px solid #222;
  border-radius: 50%;
  background: #ffe0bd;
}

.body {
  position: absolute;
  left: 20px;
  top: 31px;
  width: 5px;
  height: 36px;
  background: #222;
}

.arm {
  position: absolute;
  left: 20px;
  top: 36px;
  width: 5px;
  height: 28px;
  background: #222;
  transform-origin: top;
}

.arm1 {
  transform: rotate(50deg);
}

.arm2 {
  transform: rotate(-50deg);
}

.leg {
  position: absolute;
  left: 20px;
  top: 64px;
  width: 5px;
  height: 30px;
  background: #222;
  transform-origin: top;
}

.leg1 {
  transform: rotate(28deg);
}

.leg2 {
  transform: rotate(-28deg);
}

/* SİLAH */

.gun {
  display: none;
  position: absolute;
  left: 25px;
  top: 40px;
  width: 30px;
  height: 8px;
  background: #555;
  border: 3px solid #222;
  transform: rotate(-15deg);
}

.armed .gun {
  display: block;
}

/* NESNELER */

.object {
  position: absolute;
  bottom: 23%;
  z-index: 30;
}

/* ZOMBİ */

.zombie {
  width: 48px;
  height: 78px;
}

.zhead {
  position: absolute;
  left: 5px;
  top: 0;
  width: 37px;
  height: 37px;
  border: 4px solid #222;
  border-radius: 50%;
  background: #a8d08d;
}

.zbody {
  position: absolute;
  left: 20px;
  top: 34px;
  width: 7px;
  height: 38px;
  background: #222;
}

.zleg {
  position: absolute;
  top: 67px;
  width: 6px;
  height: 27px;
  background: #222;
}

.zleg1 {
  left: 18px;
  transform: rotate(25deg);
}

.zleg2 {
  left: 24px;
  transform: rotate(-25deg);
}

/* KAZIK */

.spikes {
  width: 90px;
  height: 45px;
  display: flex;
  align-items: flex-end;
}

.spike {
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-bottom: 43px solid #e85d5d;
  filter: drop-shadow(2px 2px 0 #222);
}

/* MERMİ KUTUSU */

.ammo {
  width: 42px;
  height: 42px;
  border: 4px solid #222;
  border-radius: 8px;
  background: #ffd43b;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 23px;
}

/* BOŞLUK */

.gap {
  position: absolute;
  bottom: 0;
  height: 35%;
  background: #fffdf5;
  border-left: 5px solid #222;
  border-right: 5px solid #222;
}

/* MERMİ */

.bullet {
  position: absolute;
  width: 15px;
  height: 5px;
  border-radius: 5px;
  background: #222;
  z-index: 80;
}

/* HUD */

#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 200;
  display: flex;
  justify-content: space-between;
  gap: 5px;
  font-size: 17px;
}

.hudBox {
  background: white;
  border: 3px solid #222;
  border-radius: 12px;
  padding: 5px 9px;
}

/* MESAJ */

#message {
  display: none;
  position: absolute;
  left: 50%;
  top: 25%;
  transform: translate(-50%, -50%);
  z-index: 300;
  padding: 12px 20px;
  background: white;
  border: 4px solid #222;
  border-radius: 15px;
  font-size: 27px;
  font-weight: bold;
  white-space: nowrap;
}

/* BAŞLANGIÇ */

#start {
  position: absolute;
  inset: 0;
  z-index: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #fffdf5;
  text-align: center;
}

#start h1 {
  margin: 0;
  font-size: 72px;
  transform: rotate(-3deg);
}

#start p {
  font-size: 20px;
  line-height: 1.5;
}

#startButton,
#restartButton {
  padding: 12px 30px;
  font-family: inherit;
  font-size: 24px;
  font-weight: bold;
  border: 5px solid #222;
  border-radius: 15px;
  background: #ffe66d;
  box-shadow: 4px 4px 0 #222;
}

#startButton:active,
#restartButton:active {
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0 #222;
}

/* OYUN SONU */

#gameover {
  position: absolute;
  inset: 0;
  z-index: 600;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(255,253,245,0.96);
  text-align: center;
}

#gameover h2 {
  margin: 5px;
  font-size: 48px;
}

.stat {
  margin: 4px;
  font-size: 21px;
}

#restartButton {
  margin-top: 15px;
}
</style>
</head>

<body>

<div id="game">

  <div id="sky">
    <div class="sun"></div>
    <div class="hill hill1"></div>
    <div class="hill hill2"></div>
    <div class="hill hill3"></div>
  </div>

  <div id="ground"></div>
  <div id="road"></div>

  <!-- HUD -->

  <div id="hud">

    <div class="hudBox">
      📏 <span id="distance">0</span> m
    </div>

    <div class="hudBox">
      ⏱️ <span id="time">0:00</span>
    </div>

    <div class="hudBox">
      🔫 <span id="ammo">0</span>
    </div>

  </div>

  <!-- MESAJ -->

  <div id="message"></div>

  <!-- OYUNCU -->

  <div id="player">

    <div class="head"></div>
    <div class="body"></div>

    <div class="arm arm1"></div>
    <div class="arm arm2"></div>

    <div class="leg leg1"></div>
    <div class="leg leg2"></div>

    <div class="gun"></div>

  </div>

  <!-- BAŞLANGIÇ -->

  <div id="start">

    <h1>KAÇ!</h1>

    <p>
      🏃 Koş.<br>
      👆 Dokun ve zıpla.<br>
      🧟 Zombilerden kaç.<br>
      🔫 Ne kadar uzağa gidebilirsin?
    </p>

    <button id="startButton">BAŞLA</button>

  </div>

  <!-- GAME OVER -->

  <div id="gameover">

    <h2>💀 YAKALANDIN!</h2>

    <div class="stat">
      📏 Mesafe:
      <b id="finalDistance">0</b> m
    </div>

    <div class="stat">
      ⏱️ Süre:
      <b id="finalTime">0:00</b>
    </div>

    <div class="stat">
      🧟 Öldürülen:
      <b id="kills">0</b>
    </div>

    <div class="stat">
      🏆 Rekor:
      <b id="record">0</b> m
    </div>

    <button id="restartButton">
      TEKRAR KOŞ
    </button>

  </div>

</div>


<script>

/* =========================
   OYUN DEĞİŞKENLERİ
========================= */

let running = false;

let playerY = 0;
let velocityY = 0;

const gravity = 0.75;
const jumpPower = 14;

let speed = 4;

let distance = 0;
let elapsed = 0;

let ammo = 0;
let kills = 0;

let lastTime = 0;
let spawnTimer = 0;

let objects = [];

let best = Number(
  localStorage.getItem("kac_rekor") || 0
);

const player =
  document.getElementById("player");

const startScreen =
  document.getElementById("start");

const startButton =
  document.getElementById("startButton");

const gameover =
  document.getElementById("gameover");

const restartButton =
  document.getElementById("restartButton");

const distanceEl =
  document.getElementById("distance");

const timeEl =
  document.getElementById("time");

const ammoEl =
  document.getElementById("ammo");

const message =
  document.getElementById("message");


/* =========================
   BAŞLAT
========================= */

function startGame() {

  if (running) return;

  startScreen.style.display = "none";
  gameover.style.display = "none";

  running = true;

  playerY = 0;
  velocityY = 0;

  speed = 4;
  distance = 0;
  elapsed = 0;
  ammo = 0;
  kills = 0;

  objects.forEach(function(o) {

    if (o.el) o.el.remove();

  });

  objects = [];

  spawnTimer = 80;

  lastTime = performance.now();

  showMessage("KOŞ!");

  requestAnimationFrame(loop);

}


/* =========================
   BUTONLAR
========================= */

startButton.addEventListener(
  "click",
  startGame
);

startButton.addEventListener(
  "touchend",
  function(e) {

    e.preventDefault();
    startGame();

  },
  { passive: false }
);

restartButton.addEventListener(
  "click",
  function() {

    location.reload();

  }
);


/* =========================
   ZIPLAMA
========================= */

function jump() {

  if (!running) return;

  if (playerY <= 1) {

    velocityY = jumpPower;

  }

}


/* iPHONE DOKUNMA */

document.addEventListener(
  "touchstart",
  function(e) {

    if (!running) return;

    e.preventDefault();

    jump();

  },
  { passive: false }
);


/* BİLGİSAYAR TESTİ */

document.addEventListener(
  "mousedown",
  function() {

    jump();

  }
);


/* =========================
   ANA OYUN DÖNGÜSÜ
========================= */

function loop(now) {

  if (!running) return;

  let dt =
    Math.min(
      (now - lastTime) / 16.67,
      2
    );

  lastTime = now;

  /* ZAMAN */

  elapsed += dt / 60;

  /* GİDEREK HIZLAN */

  speed += 0.002 * dt;

  /* ZIPLAMA FİZİĞİ */

  playerY += velocityY * dt;

  velocityY -= gravity * dt;

  if (playerY < 0) {

    playerY = 0;
    velocityY = 0;

  }

  player.style.bottom =
    "calc(23% + " +
    playerY +
    "px)";


  /* MESAFE */

  distance +=
    speed * dt * 0.45;

  distanceEl.textContent =
    Math.floor(distance);


  /* SÜRE */

  let minutes =
    Math.floor(elapsed / 60);

  let seconds =
    Math.floor(elapsed % 60)
      .toString()
      .padStart(2, "0");

  timeEl.textContent =
    minutes + ":" + seconds;


  ammoEl.textContent = ammo;


  /* NESNE ÇIKAR */

  spawnTimer -= dt;

  if (spawnTimer <= 0) {

    spawnObject();

    spawnTimer =
      Math.max(
        45,
        85 - speed * 6
      );

  }


  /* NESNELER */

  updateObjects(dt);


  requestAnimationFrame(loop);

}


/* =========================
   NESNE SEÇ
========================= */

function spawnObject() {

  let r = Math.random();

  if (r < 0.40) {

    spawnZombie();

  }
  else if (r < 0.62) {

    spawnSpikes();

  }
  else if (r < 0.76) {

    spawnAmmo();

  }
  else if (r < 0.90) {

    spawnGap();

  }
  else {

    spawnZombie();

  }

}


/* =========================
   ZOMBİ
========================= */

function spawnZombie() {

  const z =
    document.createElement("div");

  z.className =
    "object zombie";

  z.style.left =
    window.innerWidth + 60 + "px";

  z.innerHTML = `
    <div class="zhead"></div>
    <div class="zbody"></div>
    <div class="zleg zleg1"></div>
    <div class="zleg zleg2"></div>
  `;

  document
    .getElementById("game")
    .appendChild(z);

  objects.push({

    el: z,

    x: window.innerWidth + 60,

    type: "zombie",

    dead: false

  });

}


/* =========================
   KAZIK
========================= */

function spawnSpikes() {

  const s =
    document.createElement("div");

  s.className =
    "object spikes";

  s.style.left =
    window.innerWidth + 60 + "px";

  s.innerHTML = `
    <div class="spike"></div>
    <div class="spike"></div>
    <div class="spike"></div>
  `;

  document
    .getElementById("game")
    .appendChild(s);

  objects.push({

    el: s,

    x: window.innerWidth + 60,

    type: "spike"

  });

}


/* =========================
   MERMİ
========================= */

function spawnAmmo() {

  const a =
    document.createElement("div");

  a.className =
    "object ammo";

  a.textContent = "🔫";

  a.style.left =
    window.innerWidth + 60 + "px";

  document
    .getElementById("game")
    .appendChild(a);

  objects.push({

    el: a,

    x: window.innerWidth + 60,

    type: "ammo"

  });

}


/* =========================
   BOŞLUK
========================= */

function spawnGap() {

  const g =
    document.createElement("div");

  g.className = "gap";

  g.style.left =
    window.innerWidth + 60 + "px";

  g.style.width =
    (80 + Math.random() * 60) + "px";

  document
    .getElementById("game")
    .appendChild(g);

  objects.push({

    el: g,

    x: window.innerWidth + 60,

    type: "gap"

  });

}


/* =========================
   NESNELERİ HAREKET ETTİR
========================= */

function updateObjects(dt) {

  for (
    let i = objects.length - 1;
    i >= 0;
    i--
  ) {

    const o = objects[i];

    o.x -= speed * dt;

    o.el.style.left =
      o.x + "px";


    /* OTOMATİK ATEŞ */

    if (
      o.type === "zombie" &&
      ammo > 0 &&
      !o.dead &&
      player.classList.contains("armed")
    ) {

      if (
        o.x <
        window.innerWidth * 0.78 &&
        o.x >
        window.innerWidth * 0.18
      ) {

        shoot(o);

      }

    }


    /* ÇARPIŞMA */

    const rect =
      o.el.getBoundingClientRect();

    const p =
      player.getBoundingClientRect();


    if (
      rect.left < p.right - 8 &&
      rect.right > p.left + 8 &&
      rect.top < p.bottom - 8 &&
      rect.bottom > p.top + 8
    ) {


      /* MERMİ */

      if (o.type === "ammo") {

        ammo += 10;

        player.classList.add("armed");

        showMessage("🔫 +10 MERMİ");

        removeObject(i);

        continue;

      }


      /* ZOMBİ */

      if (o.type === "zombie") {

        if (playerY > 45) {

          continue;

        }

        gameOver();

        return;

      }


      /* KAZIK */

      if (o.type === "spike") {

        if (playerY < 48) {

          gameOver();

          return;

        }

      }


      /* BOŞLUK */

      if (o.type === "gap") {

        if (playerY < 30) {

          gameOver();

          return;

        }

      }

    }


    /* EKRANDAN ÇIKTI */

    if (o.x < -150) {

      removeObject(i);

    }

  }

}


/* =========================
   ATEŞ
========================= */

function shoot(zombie) {

  if (zombie.dead) return;

  if (ammo <= 0) return;

  zombie.dead = true;

  ammo--;


  const bullet =
    document.createElement("div");

  bullet.className =
    "bullet";

  let bulletX =
    window.innerWidth * 0.15 + 38;

  bullet.style.left =
    bulletX + "px";

  bullet.style.bottom =
    "calc(23% + " +
    (playerY + 38) +
    "px)";

  document
    .getElementById("game")
    .appendChild(bullet);


  let targetX =
    zombie.x;


  const interval =
    setInterval(function() {

      bulletX += 16;

      bullet.style.left =
        bulletX + "px";


      if (bulletX >= targetX) {

        clearInterval(interval);

        bullet.remove();

        zombie.el.remove();

        kills++;

        let index =
          objects.indexOf(zombie);

        if (index !== -1) {

          objects.splice(index, 1);

        }

      }

    }, 16);

}


/* =========================
   NESNE SİL
========================= */

function removeObject(i) {

  if (!objects[i]) return;

  objects[i].el.remove();

  objects.splice(i, 1);

}


/* =========================
   MESAJ
========================= */

let messageTimer = null;

function showMessage(text) {

  clearTimeout(messageTimer);

  message.textContent = text;

  message.style.display = "block";

  messageTimer =
    setTimeout(function() {

      message.style.display = "none";

    }, 1300);

}


/* =========================
   OYUN BİTTİ
========================= */

function gameOver() {

  if (!running) return;

  running = false;


  let final =
    Math.floor(distance);


  if (final > best) {

    best = final;

    localStorage.setItem(
      "kac_rekor",
      best
    );

  }


  document
    .getElementById("finalDistance")
    .textContent = final;


  document
    .getElementById("finalTime")
    .textContent =
    timeEl.textContent;


  document
    .getElementById("kills")
    .textContent = kills;


  document
    .getElementById("record")
    .textContent = best;


  gameover.style.display =
    "flex";

}


/* =========================
   HAZIR
========================= */

console.log("KAÇ! hazır.");

</script>

</body>
</html>
